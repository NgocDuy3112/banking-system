name: smartbanking-dev

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: smartbanking-postgres
    # Load env vars from configs/.env so ${POSTGRES_*} resolves correctly.
    # Without this the variables default to blank strings and auth fails.
    env_file:
      - ./configs/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0-full
    container_name: smartbanking-mlflow
    depends_on:
      postgres:
        condition: service_healthy
    # Load env vars from configs/.env so ${POSTGRES_*} resolves correctly.
    env_file:
      - ./configs/.env
    environment:
      MLFLOW_BACKEND_STORE_URI: 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}'
      # mlflow-artifacts:/ tells the client to proxy artifact uploads
      # through the tracking server's HTTP API (enabled by --serve-artifacts).
      # The server stores them at --artifacts-destination on the container fs.
      MLFLOW_DEFAULT_ARTIFACT_ROOT: mlflow-artifacts:/
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - '5000'
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - '*'
      - --cors-allowed-origins
      - '*'
    volumes:
      - ./data/mlflow/artifacts:/mlflow/artifacts
    ports:
      - "5050:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  default:
    name: smartbanking-dev-net
