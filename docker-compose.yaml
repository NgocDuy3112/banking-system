name: smartbanking-dev

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: smartbanking-postgres
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    env_file: ./configs/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - development
      - staging
      - production

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: smartbanking-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    env_file: ./configs/.env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./data/redis:/data
    profiles:
      - development
      - staging
      - production

  minio:
    image: quay.io/minio/minio:latest
    container_name: smartbanking-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ALIAS: ${MINIO_ALIAS}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    env_file: ./configs/.env
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - development
      - staging

  mailhog:
    image: mailhog/mailhog:latest
    container_name: smartbanking-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles:
      - development
      - staging

  backend:
    build: ./backend
    image: smartbanking-backend:dev
    container_name: smartbanking-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: ./configs/.env
    ports:
      - "8080:8080"
    profiles:
      - development
      - staging
      - production


networks:
  default:
    name: smartbanking-dev-net