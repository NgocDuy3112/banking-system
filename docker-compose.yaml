name: smartbanking-dev

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: smartbanking-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartbanking"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: smartbanking-backend:dev
    container_name: smartbanking-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"

  mlflow:
    image: docker.io/library/python:3.11-slim
    container_name: smartbanking-mlflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # MLflow reuses the existing Postgres database. Its table names do not
      # collide with the banking app's, so they can share the `public` schema.
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: >-
      bash -c "
      pip install --no-cache-dir 'mlflow[extras]>=2.15.0,<3' psycopg2-binary &&
      mkdir -p /var/lib/mlflow/artifacts &&
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri '$$MLFLOW_BACKEND_STORE_URI'
        --default-artifact-root /var/lib/mlflow/artifacts
      "
    volumes:
      - ./data/mlflow/artifacts:/var/lib/mlflow/artifacts
    ports:
      - "5050:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/2.0/mlflow/experiments/list', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  default:
    name: smartbanking-dev-net
