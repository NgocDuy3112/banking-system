[project]
name = "smart-banking-ml"
version = "0.1.0"
description = "Fraud detection service for the Smart Banking System"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "onnxmltools>=1.12.0",
    "asyncpg>=0.29.0",
    "skl2onnx>=1.16.0",
    "matplotlib>=3.11.0",
    "python-dotenv>=1.2.2",
    "kagglehub>=1.0.2",
    "seaborn>=0.13.2",
    "fastparquet>=2024.5.0",
    "shap>=0.46.0",
    "mlflow>=2.15.0,<3",
    "pytest>=9.1.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
testpaths = ["tests"]
