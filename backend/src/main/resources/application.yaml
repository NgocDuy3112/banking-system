spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/smartbanking}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
