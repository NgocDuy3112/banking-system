spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: backend
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2s
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.localhost: smartbanking-dev

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: PT30M
    issuer: smartbanking
  otp:
    ttl: ${OTP_TTL:PT5M}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
  refresh:
    ttl: P7D
  minio:
    provider: S3_COMPATIBLE
    region: ${MINIO_REGION}
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
    presigned-url-ttl: PT15M