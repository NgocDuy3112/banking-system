spring:
  application:
    name: backend
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2s

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: PT30M
    issuer: smartbanking
  refresh:
    ttl: P7D
  minio:
    provider: S3_COMPATIBLE
    region: ${MINIO_REGION}
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
    presigned-url-ttl: PT15M