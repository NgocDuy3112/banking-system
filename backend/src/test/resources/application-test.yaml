spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: PT30M
    issuer: smartbanking-test
  refresh:
    ttl: P7D
  minio:
    provider: S3_COMPATIBLE
    bucket: smartbanking-test-bucket
    presigned-url-ttl: PT15M